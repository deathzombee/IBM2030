; IBM System/360 Model 30 – MiSTer OSD Configuration
; -----------------------------------------------------------------------
; This .ini file is used by the MiSTer menu system to describe the core
; and its configurable options.  Place it on the SD card alongside the
; .rbf bitstream:
;   /media/fat/games/IBM2030/IBM2030_MiSTer.ini
;
; OSD options are read from the STATUS word provided by hps_io.  The
; STATUS bits mapped here correspond to STATUS[7:0] which is wired to
; the ibm2030 "sw" (slide-switch) port in IBM2030_MiSTer.vhd.
;
; Full OSD integration (keyboard mapping, ROM loading, virtual panel
; switches) is planned for a future PR.
; -----------------------------------------------------------------------

[IBM2030]
name=IBM System/360 Model 30

; ---------------------------------------------------------------
; Video options
; ---------------------------------------------------------------
; Aspect ratio (4:3 matches the 640x480 VGA output)
video_mode=0

; Integer scale off by default
vscale_mode=0

; ---------------------------------------------------------------
; Core-specific switches
; These map STATUS[7:0] → "sw" input of ibm2030.vhd
;
; In the original Spartan-3 implementation the sw[7:0] slide
; switches were used for debugging.  On MiSTer we expose a subset
; here until proper OSD panel-switch integration is added.
; ---------------------------------------------------------------
[Switch 0 – Rate: Instruction Step]
; STATUS[0] → sw[0]  (maps to RawSw_Rate_Instruction_Step)
type=bool
addr=0

[Switch 1 – Rate: Single Cycle]
; STATUS[1] → sw[1]  (maps to RawSw_Rate_Single_Cycle)
type=bool
addr=1

[Switch 2 – Chk: Diagnostic]
; STATUS[2] → sw[2]  (maps to RawSw_Chk_Diagnostic)
type=bool
addr=2

[Switch 3 – Chk: Disable]
; STATUS[3] → sw[3]  (maps to RawSw_Chk_Disable)
type=bool
addr=3

[Switch 4 – Chk: Stop]
; STATUS[4] → sw[4]  (maps to RawSw_Chk_Stop)
type=bool
addr=4

[Switch 5 – Chk: Restart]
; STATUS[5] → sw[5]  (maps to RawSw_Chk_Restart)
type=bool
addr=5
